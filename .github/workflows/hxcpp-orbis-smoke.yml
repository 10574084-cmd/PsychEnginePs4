name: Haxe hxcpp OpenOrbis smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/hxcpp/**"
      - "tests/hxcpp-orbis/**"
      - ".github/workflows/hxcpp-orbis-smoke.yml"

permissions:
  contents: read

jobs:
  cross-compile:
    name: Compile a Haxe program with hxcpp for PS4
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git libicu-dev

      - name: Set up Haxe 4.2.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Install hxcpp 4.2.1
        shell: bash
        run: |
          set -euo pipefail
          haxelib setup "$HOME/haxelib"
          haxelib install hxcpp 4.2.1
          haxelib list

      - name: Download OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf /tmp/oo.tar.gz -C "$HOME/oo"
          root="$(dirname "$(find "$HOME/oo" -name link.x -print -quit)")"
          test -f "$root/link.x"
          test -d "$root/include/c++/v1"
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "OpenOrbis sysroot: $root"

      - name: Install hxcpp Orbis cross-compiler definition
        shell: bash
        run: |
          set -euo pipefail
          hxcpp_root="$(haxelib path hxcpp | head -n 1)"
          test -f "$hxcpp_root/toolchain/haxe-target.xml"
          cp tools/hxcpp/orbis-toolchain.xml "$hxcpp_root/toolchain/orbis-toolchain.xml"
          echo "Installed custom hxcpp toolchain at $hxcpp_root/toolchain/orbis-toolchain.xml"
          command -v clang++
          command -v ld.lld

      - name: Compile Haxe source to a PS4 ELF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hxcpp-orbis
          haxe             -cp tests/hxcpp-orbis             -main Main             -cpp build/hxcpp-orbis             -D toolchain=orbis             -D orbis             -D HXCPP_M64             -D HXCPP_CPP11
          test -s build/hxcpp-orbis/Main
          file build/hxcpp-orbis/Main
          readelf -h build/hxcpp-orbis/Main | tee build/hxcpp-orbis/elf-header.txt
          grep -q "ELF64" build/hxcpp-orbis/elf-header.txt
          grep -q "Advanced Micro Devices X86-64" build/hxcpp-orbis/elf-header.txt

      - name: Upload Haxe-generated Orbis ELF
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-hxcpp-orbis-smoke
          path: |
            build/hxcpp-orbis/Main
            build/hxcpp-orbis/elf-header.txt
          if-no-files-found: error
          retention-days: 7
