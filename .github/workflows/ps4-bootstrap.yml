name: PsychEnginePs4 native bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps4-bootstrap.yml'
      - 'Makefile'
      - 'src/**'
      - 'tools/**'
      - 'sce_sys/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make curl libicu-dev clang lld python3 python3-pil zlib1g-dev
      - name: Install libssl1.1 for OpenOrbis package tool
        shell: bash
        run: |
          set -euo pipefail
          base='https://security.ubuntu.com/ubuntu/pool/main/o/openssl/'
          ver="$(curl -fsSL "$base" | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' | sed -E 's/^libssl1\.1_(.*)_amd64\.deb$/\1/' | sort -V | tail -1)"
          test -n "$ver"
          curl -fsSL "$base/libssl1.1_$ver"_amd64.deb -o /tmp/libssl1.1.deb
          sudo dpkg -i /tmp/libssl1.1.deb || sudo apt-get install -f -y
      - name: Download OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o /tmp/oo.tar.gz
          mkdir -p "$HOME/oo"
          tar -xzf /tmp/oo.tar.gz -C "$HOME/oo"
          root="$(dirname "$(find "$HOME/oo" -name link.x -print -quit)")"
          test -f "$root/link.x"
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "OO_PS4_TOOLCHAIN=$root"
      - name: Prepare original Psych Engine menu assets and patch renderer
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/0.6.3/assets/preload/images'
          mkdir -p assets/psychmenu/source
          curl -fsSL "$base/menuBG.png" -o assets/psychmenu/source/menuBG.png
          for item in story_mode freeplay mods awards credits donate options; do
            curl -fsSL "$base/mainmenu/menu_$item.png" -o "assets/psychmenu/source/menu_$item.png"
            curl -fsSL "$base/mainmenu/menu_$item.xml" -o "assets/psychmenu/source/menu_$item.xml"
          done
          python3 tools/prepare_psych_menu.py --source assets/psychmenu/source --out assets/psychmenu
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/003501f6d7a8668ce8b6d875e34dd97ad0d5d5b5/stb_vorbis.c -o src/stb_vorbis.c
      - name: Bundle stock FNF songs, vocals, charts, and license
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/0.6.3/assets'
          mkdir -p assets/songs assets/preload/data
          songs=(tutorial bopeebo fresh dad-battle spookeez south pico philly-nice blammed satin-panties high milf monster cocoa eggnog winter-horrorland senpai roses thorns ugh guns stress)
          for song in "${songs[@]}"; do
            mkdir -p "assets/songs/$song" "assets/preload/data/$song"
            curl -fsSL "$base/songs/$song/Inst.ogg" -o "assets/songs/$song/Inst.ogg"
            if curl -fsSL "$base/songs/$song/Voices.ogg" -o "assets/songs/$song/Voices.ogg"; then
              echo "Bundled vocals: $song"
            else
              rm -f "assets/songs/$song/Voices.ogg"
              echo "No separate vocal track: $song"
            fi
            for chart in "$song.json" "$song-easy.json" "$song-hard.json" events.json; do
              if curl -fsSL "$base/preload/data/$song/$chart" -o "assets/preload/data/$song/$chart"; then
                echo "Bundled chart: $song/$chart"
              else
                rm -f "assets/preload/data/$song/$chart"
              fi
            done
            test -s "assets/songs/$song/Inst.ogg"
            test -s "assets/preload/data/$song/$song.json"
          done
          curl -fsSL https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/0.6.3/LICENSE -o assets/PsychEngine-LICENSE.txt
          cat > assets/PsychEngine-ASSET-NOTICE.txt <<'EOF'
          Stock song audio and chart data are fetched at build time from
          ShadowMario/FNF-PsychEngine, tag 0.6.3.
          The upstream LICENSE is included as assets/PsychEngine-LICENSE.txt.
          This PS4 port is an independent community project and is not official.
          EOF
          test -s assets/PsychEngine-LICENSE.txt
          echo "Stock song asset payload:"
          du -sh assets/songs assets/preload/data
          test -s src/stb_vorbis.c
          python3 tools/patch_openorbis_graphics.py "$OO_PS4_TOOLCHAIN/samples/_common/graphics.h" "$OO_PS4_TOOLCHAIN/samples/_common/graphics.cpp"
      - name: Prepare package metadata, runtime modules, and valid icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sce_sys/about sce_module
          right="$(find "$OO_PS4_TOOLCHAIN" \( -name right.sprx -o -name right.prx \) -print -quit)"
          test -n "$right"
          cp "$right" sce_sys/about/right.sprx

          for module in libc.prx libSceFios2.prx; do
            module_path="$(find "$OO_PS4_TOOLCHAIN" -name "$module" -print -quit)"
            if [[ -z "$module_path" ]]; then
              echo "::error::Required runtime module $module was not found in the OpenOrbis toolchain archive."
              find "$OO_PS4_TOOLCHAIN" -iname '*.prx' -print | head -80 || true
              exit 1
            fi
            cp "$module_path" "sce_module/$module"
            echo "Bundled runtime module: $module_path"
          done

          python3 - <<'PY'
          import struct, zlib
          w = h = 512
          raw = bytearray()
          p_rows = [0x1E, 0x11, 0x11, 0x1E, 0x10, 0x10, 0x10]
          scale = 42
          px0, py0 = 151, 110
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  if x < 14 or x >= w - 14 or y < 14 or y >= h - 14:
                      rgb = (239, 45, 71)
                  elif 80 <= x < 432 and 424 <= y < 438:
                      rgb = (68, 190, 255)
                  else:
                      gx = (x - px0) // scale
                      gy = (y - py0) // scale
                      is_p = (0 <= gx < 5 and 0 <= gy < 7 and
                              (p_rows[gy] & (1 << (4 - gx))) != 0)
                      rgb = (244, 246, 250) if is_p else (13, 16, 31)
                  raw.extend(rgb)
          def chunk(tag, data):
              return (struct.pack('>I', len(data)) + tag + data +
                      struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))
          png = (bytes([137, 80, 78, 71, 13, 10, 26, 10]) +
                 chunk(b'IHDR', struct.pack('>2I5B', w, h, 8, 2, 0, 0, 0)) +
                 chunk(b'IDAT', zlib.compress(bytes(raw), 9)) +
                 chunk(b'IEND', b''))
          with open('sce_sys/icon0.png', 'wb') as icon:
              icon.write(png)
          data = open('sce_sys/icon0.png', 'rb').read()
          assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), 'invalid PNG signature'
          assert data[12:16] == b'IHDR', 'missing PNG IHDR'
          width, height, depth, color_type, *_ = struct.unpack('>IIBBBBB', data[16:29])
          assert (width, height, depth, color_type) == (512, 512, 8, 2), 'icon must be 512x512 RGB PNG'
          print(f'Validated icon0.png: {width}x{height}, 24-bit RGB')
          PY
          file sce_sys/icon0.png
      - name: Build PS4 bootstrap ELF and PKG
        shell: bash
        run: |
          set -euo pipefail
          clang_bin="$(command -v clang)"
          cxx_bin="$(command -v clang++)"
          lld_bin="$(command -v ld.lld || true)"
          if [[ -z "$lld_bin" ]]; then
            lld_bin="$(command -v ld.lld-14 || true)"
          fi
          if [[ -z "$lld_bin" ]]; then
            lld_bin="$(find /usr/bin /usr/local/bin -name 'ld.lld-*' -executable -print -quit 2>/dev/null || true)"
          fi
          echo "Host clang: $clang_bin"
          echo "Host clang++: $cxx_bin"
          echo "Host LLD: $lld_bin"
          test -x "$clang_bin"
          test -x "$cxx_bin"
          test -x "$lld_bin"
          make CC="$clang_bin" CXX="$cxx_bin" LD="$lld_bin"
          test -s 'IV0000-PSYH00001_00-PSYCHENG00000000.pkg'
          test -s eboot.bin
          file eboot.bin 'IV0000-PSYH00001_00-PSYCHENG00000000.pkg'
      - name: Upload bootstrap test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PsychEnginePs4-original-menu-v0.2
          path: |
            IV0000-PSYH00001_00-PSYCHENG00000000.pkg
            eboot.bin
            build/psychengine_ps4_bootstrap.elf
            sce_sys/icon0.png
            sce_sys/param.sfo
            sce_module/libc.prx
            sce_module/libSceFios2.prx
          if-no-files-found: error
          retention-days: 14
