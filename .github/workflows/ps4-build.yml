name: PsychEngine PS4 (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps4-build.yml'
      - 'README.md'
      - 'source/**'
      - 'vendor/**'
      - '.gitmodules'
      - 'assets/**'
      - 'Project.xml'
      - 'project.xml'
      - 'Makefile'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  inspect-and-package:
    name: Audit upstream engine and PS4 port
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PS4 port repository
        uses: actions/checkout@v4


      - name: Inspect source and generate honest port report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "PsychEnginePs4 — port feasibility report"
            echo "Generated: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "Upstream source: https://github.com/ShadowMario/FNF-PsychEngine"
            echo "Pinned submodule revision: $(git -C vendor/PsychEngine rev-parse HEAD)"
            echo
            echo "Project metadata:"
            grep -E '<app |<window |<haxedef name="(LUA_ALLOWED|MODS_ALLOWED|VIDEOS_ALLOWED)' vendor/PsychEngine/Project.xml || true
            echo
            echo "Available build/config files:"
            find vendor/PsychEngine -maxdepth 2 -type f \( -name 'Project.xml' -o -name 'haxelib.json' -o -name 'Makefile' -o -name 'CMakeLists.txt' -o -name '*.yml' \) -not -path '*/.git/*' | sort | head -100
            echo
            echo "PS4 port repository native entry points:"
            find . -maxdepth 4 -type f \( -name 'Makefile' -o -name 'CMakeLists.txt' -o -name 'main.cpp' -o -name '*.mk' \) -not -path './.git/*' | sort
            echo
            if grep -Eiq 'if="ps4"|name="ps4"|target.*ps4' vendor/PsychEngine/Project.xml; then
              echo "A PS4 target marker was found in Project.xml; it still requires toolchain validation."
            else
              echo "BLOCKER: upstream Project.xml does not declare a PS4 target."
            fi
            if find . -maxdepth 4 -type f \( -name 'Makefile' -o -name 'CMakeLists.txt' -o -name 'main.cpp' \) -not -path './.git/*' | grep -q .; then
              echo "A native entry point exists in this repository; it must still be implemented and linked against PS4 APIs."
            else
              echo "BLOCKER: this repository has platform interface declarations only, not a native PS4 application entry point."
            fi
            echo
            echo "Result: this audit does not compile a game and does not produce a PKG."
            echo "Required before a real PKG: implement a PS4 runtime/backend, port or replace the Haxe/Lime/OpenFL runtime dependencies, compile with a PS4 toolchain, then package and test on compatible hardware."
          } | tee dist/PORT-FEASIBILITY.txt

          git archive --format=zip --prefix=PsychEnginePs4/ HEAD -o dist/PsychEnginePs4-source.zip
          cat > dist/BUILD-STATUS.txt <<'EOF'
          PsychEnginePs4 build status
          This workflow audits the official Psych Engine source against this experimental port scaffold.
          It does NOT produce a PS4 ELF or PKG and does not claim the game is playable on PS4.
          See PORT-FEASIBILITY.txt for the detected blockers.
          EOF

      - name: Upload audit and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PsychEnginePs4-port-audit
          path: dist/
          if-no-files-found: error
          retention-days: 14
