name: Psych Engine source validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/PsychEngine"
      - ".github/workflows/psychengine-source-validation.yml"

permissions:
  contents: read

jobs:
  build-upstream-linux:
    name: Compile the real Haxe/OpenFL game source (Linux validation)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project and pinned Psych Engine source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Haxe used by Psych Engine 0.6.3
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libvlc-dev libvlccore-dev libgl1-mesa-dev libasound2-dev

      - name: Install upstream Haxe libraries (versions compatible with Psych Engine 0.6.3)
        working-directory: vendor/PsychEngine
        shell: bash
        run: |
          set -euo pipefail
          haxelib setup "$HOME/haxelib"

          # Psych Engine 0.6.3 is not compatible with the current Flixel/Lime/OpenFL releases.
          # Pin the stack to the versions documented for this engine generation.
          haxelib install hxcpp 4.2.1
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-ui 2.5.0
          haxelib install flixel-addons 3.0.2
          haxelib install tjson 1.4.0
          haxelib install hxjsonast 1.1.0
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec.git
          haxelib install hscript 2.5.0
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          haxelib install hxcpp-debug-server 1.2.4

          # lime setup can install optional Flixel tools; force the engine-tested versions afterward.
          haxelib set hxcpp 4.2.1
          haxelib set lime 8.0.1
          haxelib set openfl 9.2.1
          haxelib set flixel 5.2.2
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-ui 2.5.0
          haxelib set flixel-addons 3.0.2
          haxelib set hscript 2.5.0
          haxelib set tjson 1.4.0
          haxelib set hxjsonast 1.1.0
          haxelib list

      - name: Compile actual Psych Engine source for Linux
        working-directory: vendor/PsychEngine
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build Project.xml linux --app-version="source-validation-${GITHUB_RUN_ID}"
          test -d export/release/linux/bin
          find export/release/linux/bin -maxdepth 2 -type f -printf '%p %s bytes\n' | head -100

      - name: Upload source-built Linux binary for validation
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-source-linux-validation
          path: vendor/PsychEngine/export/release/linux/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Record PS4 limitation
        if: always()
        shell: bash
        run: |
          {
            echo "This job compiles the pinned upstream Haxe source for Linux only."
            echo "A successful Linux build is not a PS4 build."
            echo "The PS4 target still needs an hxcpp toolchain target and a Lime/OpenFL native backend for OpenOrbis."
          } >> "$GITHUB_STEP_SUMMARY"
