name: Psych Engine source validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/PsychEngine"
      - ".github/workflows/psychengine-source-validation.yml"

permissions:
  contents: read

jobs:
  build-upstream-linux:
    name: Compile the real Haxe/OpenFL game source (Linux validation)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project and pinned Psych Engine source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Haxe used by Psych Engine 0.6.3
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libvlc-dev libvlccore-dev libgl1-mesa-dev libasound2-dev

      - name: Cache Haxe libraries
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxe-4.2.5-psych063-${{ hashFiles('.github/workflows/psychengine-source-validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-haxe-4.2.5-psych063-

      - name: Install upstream Haxe libraries (versions compatible with Psych Engine 0.6.3)
        working-directory: vendor/PsychEngine
        shell: bash
        run: |
          set -euo pipefail
          haxelib setup "$HOME/haxelib"

          # Suppress Haxelib's per-chunk progress output so CI logs do not balloon.
          run_haxelib() {
            local label="$1"
            shift
            local log_file="$RUNNER_TEMP/haxelib-${label//[^A-Za-z0-9_-]/_}.log"
            echo "::group::${label}"
            if timeout 600 "$@" >"$log_file" 2>&1; then
              tail -n 12 "$log_file" || true
            else
              status=$?
              echo "::error::${label} failed (exit $status)"
              tail -n 100 "$log_file" || true
              echo "::endgroup::"
              return "$status"
            fi
            echo "::endgroup::"
          }

          # Psych Engine 0.6.3 Main.hx uses the Flixel 4.x FlxGame constructor.
          run_haxelib "install hxcpp 4.2.1" haxelib install hxcpp 4.2.1
          run_haxelib "install lime 8.0.1" haxelib install lime 8.0.1
          run_haxelib "install openfl 9.2.1" haxelib install openfl 9.2.1
          run_haxelib "install flixel 4.11.0" haxelib install flixel 4.11.0
          run_haxelib "install flixel-tools 1.5.1" haxelib install flixel-tools 1.5.1
          run_haxelib "install flixel-ui 2.4.0" haxelib install flixel-ui 2.4.0
          run_haxelib "install flixel-addons 2.11.0" haxelib install flixel-addons 2.11.0
          run_haxelib "install tjson 1.4.0" haxelib install tjson 1.4.0
          run_haxelib "install hxjsonast 1.1.0" haxelib install hxjsonast 1.1.0
          run_haxelib "install hxCodec" haxelib git hxCodec https://github.com/polybiusproxy/hxCodec.git
          run_haxelib "install hscript 2.5.0" haxelib install hscript 2.5.0
          run_haxelib "install linc_luajit" haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          run_haxelib "install hscript-ex" haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          run_haxelib "install discord_rpc" haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          run_haxelib "install hxcpp-debug-server 1.2.4" haxelib install hxcpp-debug-server 1.2.4

          run_haxelib "activate hxcpp 4.2.1" haxelib set hxcpp 4.2.1
          run_haxelib "activate lime 8.0.1" haxelib set lime 8.0.1
          run_haxelib "activate openfl 9.2.1" haxelib set openfl 9.2.1
          run_haxelib "activate flixel 4.11.0" haxelib set flixel 4.11.0
          run_haxelib "activate flixel-tools 1.5.1" haxelib set flixel-tools 1.5.1
          run_haxelib "activate flixel-ui 2.4.0" haxelib set flixel-ui 2.4.0
          run_haxelib "activate flixel-addons 2.11.0" haxelib set flixel-addons 2.11.0
          run_haxelib "activate hscript 2.5.0" haxelib set hscript 2.5.0
          run_haxelib "activate tjson 1.4.0" haxelib set tjson 1.4.0
          run_haxelib "activate hxjsonast 1.1.0" haxelib set hxjsonast 1.1.0
          haxelib list

      - name: Compile actual Psych Engine source for Linux
        working-directory: vendor/PsychEngine
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build Project.xml linux --app-version="source-validation-${GITHUB_RUN_ID}"
          test -d export/release/linux/bin
          find export/release/linux/bin -maxdepth 2 -type f -printf '%p %s bytes\n' | head -100

      - name: Upload source-built Linux binary for validation
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-source-linux-validation
          path: vendor/PsychEngine/export/release/linux/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Record PS4 limitation
        if: always()
        shell: bash
        run: |
          {
            echo "This job compiles the pinned upstream Haxe source for Linux only."
            echo "A successful Linux build is not a PS4 build."
            echo "The PS4 target still needs an hxcpp toolchain target and a Lime/OpenFL native backend for OpenOrbis."
          } >> "$GITHUB_STEP_SUMMARY"
